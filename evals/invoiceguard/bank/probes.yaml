- id: P-N11
  provenance: n-probe
  category: execution
  question: "Did benchmark scoring have any errors on 2026-04-15?"
  gold: gold/p_benchmark_clean_day.py
  expected_gold: {errors: 0, ran_that_day: true, date: "2026-04-15"}
  xfail:
    ref: N11
    note: >-
      The anchoring mechanism is fixed: fp4-slice reps 3-5 reached
      the e0-error/e1-recovery scenario and drafted from the clean
      e1, citing error_count via placeholder. The in-scenario
      residual is different — an appended date-disclaimer ("The date
      ... is not supported by the tool evidence") and the backticked
      poolless error_count identifier (N13's class) leave the answer
      unverified at exit 2. Reps 1-2 never reached the scenario (N5
      early-surrender, no licensed retry); the setup block excludes
      those from the denominator.
  expect:
    exit: [0]
    setup: {min_invocations: 2, min_errored: 1, min_ok: 1}
    assertions:
      - {kind: nonempty}
      - {kind: contains, pattern: '\b(no|none|zero|clean)\b', regex: true}
      - kind: not_contains
        pattern: '(does not provide|no information|cannot determine)'
        regex: true
  note: >-
    Clean day, informal name. The not_contains keeps sentinel teeth:
    an exit-0 evidence-shrug is a breach, not a pass.

