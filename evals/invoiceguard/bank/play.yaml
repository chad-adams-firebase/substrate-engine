- id: W4
  provenance: user-sourced
  category: code
  question: "What are the 12 audit rules, and what does each one do?"
  gold: gold/w5_rules_count.py
  expected_gold: {value: 12}
  threshold: 0.8
  xfail:
    ref: ASSOC
    note: >-
      Play W4: the drafter zipped the 12 descriptions against the
      node list offset by 6 — every rule name real, every description
      real, every pairing wrong — and the Verifier, which checks
      entity existence, not association, verified it. The contains
      tripwire pairs rate_variance with a fragment of its own
      docstring on one line; the offset zip fails it. Association
      verification is the queued design item this row measures.
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, pattern: "rate_variance"}
      - kind: contains
        regex: true
        pattern: "rate_variance[^\\n]{0,240}contract"
  note: >-
    A correct answer describes rule_rate_variance with its contracted-
    rate meaning in the same breath; contains never alarms, so this
    measures without gating the invariant.
