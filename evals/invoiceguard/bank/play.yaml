- id: W4
  provenance: user-sourced
  category: code
  question: "What are the 12 audit rules, and what does each one do?"
  gold: gold/w5_rules_count.py
  expected_gold: {value: 12}
  threshold: 0.8
  xfail:
    ref: ASSOC
    note: >-
      Play W4: the drafter zipped the 12 descriptions against the
      node list offset by 6 — every rule name real, every description
      real, every pairing wrong — and the Verifier, which checks
      entity existence, not association, verified it. The contains
      tripwire pairs rate_variance with a fragment of its own
      docstring on one line; the offset zip fails it. Association
      verification is the queued design item this row measures.
      XPASS 5/5 on 2026-08-30 and 2026-09-02 under the pinned model:
      no association code has landed, so the pairing is right by
      the model's habit, not by construction — stochastic, and the
      block stays until the Verifier checks association (Phase 5
      Block 2 ruling). Post-Block-2 (2026-09-02): 0/5, every rep a
      refusal — four surrendered after the primer and the documents
      returned no list (the refuse verb's Block 2 description invited
      it), one pathed {{e3.text.CONSTANT}} into read_source's text.
      Neither is the association gap this block names, so the row now
      gates on reaching a drafted answer (setup exit 0 or 2): a refusal
      is scenario-not-reached, never an expected failure.
  expect:
    exit: [0]
    setup: {exit: [0, 2]}
    assertions:
      - {kind: nonempty}
      - {kind: contains, pattern: "rate_variance"}
      - kind: contains
        regex: true
        pattern: "rate_variance[^\\n]{0,240}contract"
  note: >-
    A correct answer describes rule_rate_variance with its contracted-
    rate meaning in the same breath; contains never alarms, so this
    measures without gating the invariant.

# Play Session #2 rows (2026-09-02, browser at 864114d): three
# wrong-but-verified answers in the one schema region the Dictionary
# Map had never covered (review_reports, review_report_lines,
# invoices.supplier_acceptance, correction application), one refused
# layup, one render defect — locked in with executed gold after the
# coverage pass covered the region. The WBV rate tracks substrate
# coverage: same engine, same guards as the bank's INVARIANT: ok run
# the same day. Question texts are the session's verbatim (work.db
# conversation 2, and conversation 1 turn 2 for F1).

- id: W-A
  provenance: user-sourced
  category: data
  question: "When auditors request corrections, what rate do they ask for?"
  gold: gold/wa_requested_rate_is_contract.py
  expected_gold: {rate_corrections: 85, at_contract_rate: 85}
  threshold: 0.6
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [run_sql]}
      - {kind: contains, pattern: "contract"}
      - {kind: not_contains, pattern: "'CORRECTION'"}
      - {kind: not_contains, pattern: '\b0\.\d+\s?%', regex: true}
      - {kind: numeric_from_gold, field: [rate_corrections, at_contract_rate], breach: false}
  note: >-
    Play #2 W-A: 0.298% verified — "rate" read as a percentage, the
    router paraphrasing it into "what percentage of findings" and the
    SQL landing on findings.category = 'CORRECTION'. Truth: a dollar
    rate, always the contract rate, 85/85. The category literal in the
    caption is the mechanism's tripwire; the percent guard is narrow (a
    sub-1% figure) so "100% match the contract rate" stays legal.
    Grounded by requested_rate_is_contract_rate and the router's
    verbatim rule.

