# Ambiguity rows. Gate verdict §7.8 asked whether clarify CAN fire;
# for 522 live turns across five sessions it never did, and the tested
# behavior became answering under a stated reading. The 2026-08-30
# post-Block-1 run ended that record: AMB2 clarified on 3 of 5 reps —
# the fix-pass-3 concrete trigger ("two materially different
# readings") finally firing, against a row that still demanded exit 0.
# Both behaviors are correct here, so both are accepted (the play-pass
# AMB2 correction): exit 0 with a gold-matching total and a named
# reading, or exit 4 with a clarify that actually poses two readings.
# The per-exit split uses at_exit — a clarify body has no gold token
# to carry, and a numeric guard has nothing to say about a question.
# Choosing a reading is fine, silent choosing is not; a shrug dressed
# as a clarify ("please rephrase") passes neither arm.

- id: AMB1
  provenance: user-sourced
  category: ambiguity
  question: "How many invoices go unreviewed per day?"
  gold: gold/amb1_unreviewed.py
  expected_gold: {backlog: 78, lapsed: 679}
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, regex: true, pattern: "READY|RECEIVED|LAPSED"}
  note: >-
    U3's seed row: session 2 silently chose the current-backlog
    reading (78) over the never-reviewed LAPSED reading (679). The
    gold computes both totals to prove the ambiguity is real, but the
    fp3 re-run answered a third, literal reading on every rep — a
    per-day table of the current backlog (cells summing to 78, never
    stating it) — which no total-valued numeric can grade. So this
    row asserts only that the chosen statuses are named; AMB2 carries
    the numeric guard for a silently wrong reading.

- id: AMB2
  provenance: scripted
  category: ambiguity
  question: "How many invoices are open?"
  gold: gold/amb2_open.py
  expected_gold: {ready: 78, not_closed: 965}
  expect:
    exit: [0, 4]
    assertions:
      - {kind: nonempty}
      - {kind: contains, regex: true, pattern: "READY|CLOSED", at_exit: [0]}
      - {kind: numeric_from_gold, field: [ready, not_closed], at_exit: [0]}
      # The clarify arm: the question must pose two readings ("do you
      # mean X, or Y?"), loosely matched — observed clarify bodies
      # phrase the readings without status tokens, so demanding
      # READY/CLOSED by name would re-break the row — with a guard
      # against the degenerate please-rephrase shrug.
      - {kind: contains, regex: true, pattern: "mean.+\\bor\\b.+\\?", at_exit: [4]}
      - {kind: not_contains, pattern: "rephrase", at_exit: [4]}
  note: >-
    'Open' names no status: READY (78) and not-CLOSED (965) are both
    defensible, twelve-fold apart. At exit 0 either total passes and a
    verified number matching neither is wrong content — the breach
    guard stays. At exit 4 (first observed 2026-08-30, clarify's first
    firing ever: 3 of 5 reps asked "pending review, or never
    reviewed?") the clarify must pose two readings. The fp3 re-run's
    third definition (a four-status predicate answering 78) still
    lands on the exit-0 arm. The post-duration run breached here three
    times (guard pass): the enum lint challenged that four-status
    predicate's never-observed members and pointed at invoice_history
    as where they live; the model read the pointer as an instruction
    and 6,432 transitions shipped verified as an invoice count. Fixed
    at the mechanism — the lint no longer names another table or fires
    on a mixed IN list, and run_sql.entity_count_exceeds_table warns on
    any invoice_count past the invoices table — so the verdict carries
    the diagnosis. No caption regex on invoice_history: a correct
    answer may legitimately read it (the latest transition per invoice
    is current status) and land at 78; this numeric guard, with breach
    semantics, is the content check and stays exactly as it is.
