# Ambiguity rows. Gate verdict §7.8 asked whether clarify CAN fire;
# it has fired zero times in 522 live turns across five sessions, and
# the engine's revealed behavior is to answer under a stated reading.
# That is now the tested behavior: choosing a reading is fine, silent
# choosing is not. The naming assertion reads the answer plus a table's
# SQL caption (the displayed statement of the choice) and asserts that
# a reading is named — not that exactly one is. The router keeps its
# clarify verb; a clarify turn is exit 4 here, a threshold failure
# (breaches need exit 0), never a breach.

- id: AMB1
  provenance: user-sourced
  category: ambiguity
  question: "How many invoices go unreviewed per day?"
  gold: gold/amb1_unreviewed.py
  expected_gold: {backlog: 78, lapsed: 679}
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, regex: true, pattern: "READY|RECEIVED|LAPSED"}
  note: >-
    U3's seed row: session 2 silently chose the current-backlog
    reading (78) over the never-reviewed LAPSED reading (679). The
    gold computes both totals to prove the ambiguity is real, but the
    fp3 re-run answered a third, literal reading on every rep — a
    per-day table of the current backlog (cells summing to 78, never
    stating it) — which no total-valued numeric can grade. So this
    row asserts only that the chosen statuses are named; AMB2 carries
    the numeric guard for a silently wrong reading.

- id: AMB2
  provenance: scripted
  category: ambiguity
  question: "How many invoices are open?"
  gold: gold/amb2_open.py
  expected_gold: {ready: 78, not_closed: 965}
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, regex: true, pattern: "READY|CLOSED"}
      - {kind: numeric_from_gold, field: [ready, not_closed]}
  note: >-
    'Open' names no status: READY (78) and not-CLOSED (965) are both
    defensible, twelve-fold apart. Either total passes; a verified
    number matching neither is wrong content at exit 0 — the breach
    guard the clarify expectation never had. The fp3 re-run answered
    78 on every rep through a four-status predicate (RECEIVED, READY,
    CLAIMED, IN_REVIEW), a third definition landing on the first.
