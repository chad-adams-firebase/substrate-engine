  question: "Which supplier gets flagged most often for rate variance?"
  gold: gold/c5_rate_variance_supplier.py
  expected_gold:
    supplier: RVX01
    supplier_name: Ravenswood Extrusion
    count: 257
    runner_up: QUILL8
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [run_sql]}
      - {kind: name_from_gold, field: [supplier, supplier_name]}
  note: >-
    Story 1 — RVX01 at 23x the runner-up. Code or display name both
    pass: the grounding mandate (f709d9c) joins ids to names, so the
    engine may say "Ravenswood Extrusion" where it once said RVX01.

- id: S2
  provenance: scripted
  category: data
  question: "Is SVC-4410 usually flagged for excessive service hours?"
  gold: gold/s2_svc4410_service_hours.py
  expected_gold: {flagged: 63, lines: 66, rate: 0.9545}
  threshold: 0.8
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, pattern: "SVC-4410"}
      - {kind: numeric_from_gold, field: rate}
  note: >-
    Story 2 — composite (invoice_id, line_number) join required;
    invoice_id-only cross-multiplies. Post-coverage (2026-09-02): all
    five reps computed 0.9545 and three verified — as a one-cell rate
    table rendering 95.5%, which the prose assertion `\byes\b` failed
    (a table answers the question; nothing says yes). The numeric is
    the check (the ×100 arm matches 95.5%); the item-code contains
    reads body and caption, so it pins that the SQL filtered on
    SVC-4410 rather than that prose named it. The other two reps were
    warn-capped by fan_out_override on the gotcha's own LEFT JOIN
    indicator shape; the gotcha now recommends EXISTS.

