  category: data
  question: "What are the possible values of invoices.status?"
  gold: gold/np6_status_values.py
  expected_gold:
    statuses: [CLOSED, LAPSED, NO_REVIEW_NEEDED, READY]
  threshold: 0.6
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: contains, pattern: CLOSED}
      - {kind: contains, pattern: LAPSED}
      - {kind: contains, pattern: NO_REVIEW_NEEDED}
      - {kind: contains, pattern: READY}
  note: >-
    Evidence-conflict probe: data-scan sees 4 values, the primer's
    lifecycle has 7. The best answer distinguishes observed-terminal
    from full lifecycle; the threshold is loose because the nuance is
    a judgment the grader cannot referee mechanically.

