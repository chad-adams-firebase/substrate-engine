# The carryback §3 question bank — all 28 rows of the table (the
# docs variously say 25/27; the table is authoritative). Question
# texts are verbatim from docs/phase4-acceptance-carryback.md.
# Every gold value is recomputed by the referenced script at grade
# time; expected_gold is the committed tripwire --check-gold audits.

- id: B1
  provenance: scripted
  category: docs
  question: "What is this application?"
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [app_primer]}
      - {kind: route, mode: must_not_include, tools: [traverse_code_knowledge_graph]}
  note: L0 phasing done-check — primer route, never CKG.

- id: B2
  provenance: scripted
  category: docs
  question: "How does invoice scoring work?"
  threshold: 0.8
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: no_text_block_dump, xfail_ref: O1}
  note: >-
    L1. First-ever exit 0 in session 3; historically the wobbliest
    row (S1 verifier false-pos, S2 N1/N2). The dump guard is
    per-assertion xfail O1. The O1 guard landed in Phase 5 Block 2
    (2ccc5eb): a passage-valued placeholder resolves only inside a
    fenced code block, elsewhere it retries as "values, not
    passages". Test-verified, not live-witnessed — delete the
    xfail_ref deliberately on the first live run that passes it.

