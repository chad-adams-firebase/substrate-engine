- id: S4
  provenance: scripted
  category: data
  question: "How many invoices have totals that don't match their line sums but were never flagged?"
  gold: gold/s4_silent_adjustments.py
  expected_gold: {value: 114, flagged_mismatches: 42}
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [run_sql]}
      - {kind: numeric_from_gold, field: value}
  note: >-
    Story 4 gotcha — silent adjustments are sanctioned, not errors.
    Carried the WBV-S4 xfail from the 4b baseline (1/5 verified 0:
    adjustment_flag = 0 and NOT EXISTS any finding — the gotcha's exact
    query, ignored) through fp3-confirm 3/5 (misses zero-challenge-
    capped at exit 2). XPASS 5/5 on 2026-08-30, 2026-09-02 (post-pin-
    pass) and 2026-09-02 (post-Block-2), every rep the gotcha's exact
    query; the flip attributes to the model pin (98b3232), and the
    block came off in the coverage pass with the standard revised: a
    pinned, reproducible model is not luck, and an xfail that predicts
    nothing masks the regression it would have caught. An ordinary row
    now — a miss here is a threshold failure, a verified wrong count a
    breach.

