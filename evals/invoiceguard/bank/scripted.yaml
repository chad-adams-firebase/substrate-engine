- id: C1
  provenance: scripted
  category: execution
  question: "Did the stale sweep run on May 29?"
  gold: gold/c1_stale_sweep_may29.py
  expected_gold: {ran: true, count: 1, date: "2026-05-29"}
  xfail:
    ref: N10
    note: >-
      Prose "May 29" extracts bare numeral 29; the value pool holds
      count=1 and nothing calendar-shaped; the date lives in
      run_status.detail text, unreachable by numeric claims. Correct
      answer delivered since session 3, downgraded to exit 2.
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [check_execution]}
      - {kind: contains, pattern: '\byes\b', regex: true}
  note: Yearless phrasing — also re-proves the #3a 2026 anchor.

- id: C1b
  provenance: scripted
  category: execution
  question: "Did the stale sweep run on 2026-05-29?"
  gold: gold/c1_stale_sweep_may29.py
  expected_gold: {ran: true, count: 1, date: "2026-05-29"}
  xfail:
    ref: N10
    note: Same class as C1 — the ISO phrasing control.
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [check_execution]}
      - {kind: contains, pattern: '\byes\b', regex: true}

- id: C2
  provenance: scripted
  category: docs
  question: "Why is the rate variance threshold set at 15%?"
  threshold: 0.8
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [search_business_docs]}
      - {kind: route, mode: must_not_include, tools: [traverse_code_knowledge_graph]}
      - kind: contains
        pattern: '(surcharg|indexation|substitution|clawback|self-resolv)'
        regex: true
  note: >-
    Why-question: the Calloway memo's rationale, not the CKG's value.
    The pattern names the memo's own vocabulary — the gold here is
    the human-authored doc itself.

