# The carryback §3 question bank — all 28 rows of the table (the
# docs variously say 25/27; the table is authoritative). Question
# texts are verbatim from docs/phase4-acceptance-carryback.md.
# Every gold value is recomputed by the referenced script at grade
# time; expected_gold is the committed tripwire --check-gold audits.

- id: B1
  provenance: scripted
  category: docs
  question: "What is this application?"
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [app_primer]}
      - {kind: route, mode: must_not_include, tools: [traverse_code_knowledge_graph]}
  note: L0 phasing done-check — primer route, never CKG.

- id: B2
  provenance: scripted
  category: docs
  question: "How does invoice scoring work?"
  threshold: 0.8
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: no_text_block_dump, xfail_ref: O1}
  note: >-
    L1. First-ever exit 0 in session 3; historically the wobbliest
    row (S1 verifier false-pos, S2 N1/N2). The dump guard is
    per-assertion xfail O1 (text-block injection is cosmetic until
    the O1 guard lands).

- id: B3
  provenance: scripted
  category: code
  question: "What does invoiceguard.spine.rules_engine.run_rules call, in order?"
  gold: gold/b3_run_rules_callees.py
  expected_gold:
    callee_count: 16
    first_line: 84
    last_line: 113
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [traverse_code_knowledge_graph]}
      - {kind: contains, pattern: rule_rate_variance}
      - {kind: contains, pattern: format_event}
      - {kind: contains, pattern: run_prior_audit}
      - {kind: numeric_from_gold, field: callee_count}
  note: L2 — 16 callees by CKG edge line order (84-113).

- id: B4
  provenance: scripted
  category: code
  question: "Show me the source of rule_rate_variance"
  gold: gold/b4_rule_rate_variance_source.py
  expected_gold:
    qualified_name: invoiceguard.spine.rules_engine.rule_rate_variance
    file_path: src/invoiceguard/spine/rules_engine.py
    start_line: 116
    end_line: 149
  xfail:
    ref: N9
    note: >-
      The backticked file path fails both delimiter containment
      (injected span excludes backticks) and pool reachability
      (paths harvest into vocabulary, quote claims shop only in
      quote_corpus). Fails exactly when the draft states the path —
      S2's control passed only because that draft omitted it.
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - {kind: route, mode: must_include, tools: [read_source]}
      - {kind: contains, pattern: "def rule_rate_variance("}
  note: L3 with the bare, most-human name (N4 resolution now handles it).

