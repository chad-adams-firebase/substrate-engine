# Recovery-path rows (gate verdict §7.6): assert the retry COUNT,
# not just the outcome — N5's license is exactly one corrected call
# after a steering error, and over-retry is as much a regression as
# surrender.
#
# 2026-09-01 (pin pass): REC-CKG gained a clarify arm. Under the
# pinned model the engine clarifies on genuinely ambiguous node names
# (4/5 reps in the post-play-pass run) instead of picking a candidate
# and retrying — behavior the gold itself endorses (candidate_count:
# 2). That supersedes the near-miss-retry expectation: the retry arm
# remains for reps that pick a candidate, at_exit-scoped the AMB2
# way; the exit-4 arm requires both candidates named and a question
# asked. A clarify is neither retry nor over-retry.

- id: REC-SQL
  provenance: scripted
  category: recovery
  question: "SELECT COUNT(*) FROM invoices"
  gold: gold/rec_sql_total.py
  expected_gold: {value: 1990}
  threshold: 0.6
  expect:
    exit: [0]
    assertions:
      - {kind: nonempty}
      - kind: retry_count
        tool: run_sql
        errors: [0, 1]
        error_contains: "writes its own SQL"
      - {kind: numeric_from_gold, field: value}
  note: >-
    A SQL-shaped question must bounce at run_sql's boundary
    (ef55477) and recover through one English rephrase — or be
    rephrased before it ever reaches the boundary: the post-duration
    rep 3 sent "How many rows are there in the invoices table?" on its
    first call, no bounce, 1,990. The row measures recovery, and
    pre-emptive recovery is recovery (guard pass), so 0 or 1 bounce
    passes; two would mean the licensed retry was itself SQL.

- id: REC-CKG
  provenance: scripted
  category: recovery
  question: "Show me the source of health"
  gold: gold/rec_ckg_health.py
  expected_gold: {candidate_count: 2}
  threshold: 0.6
  expect:
    exit: [0, 2, 4]
    assertions:
      - {kind: nonempty}
      - kind: retry_count
        tool: traverse_code_knowledge_graph
        errors: 1
        error_contains: "names 2 nodes"
        at_exit: [0, 2]
      - {kind: contains, pattern: "def health(", at_exit: [0, 2]}
      - kind: contains
        regex: true
        pattern: '(?s)invoiceguard\.[\w.]*health[\w.]*.*invoiceguard\.[\w.]*health[\w.]*.*\?'
        at_exit: [4]
  note: >-
    'health' is a genuinely ambiguous bare suffix (module + function)
    — the steering error names both candidates. A rep that picks one
    is licensed exactly one retry and must show the source (N4's
    error path + N5's license); a rep that clarifies must name both
    candidates and ask (the pin-pass arm — see the header note).
