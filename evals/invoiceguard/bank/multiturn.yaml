- id: MT3
  provenance: scripted
  category: multiturn
  gold: gold/mt3_switch.py
  expected_gold:
    supplier: RVX01
    supplier_name: Ravenswood Extrusion
    start_line: 116
  xfail:
    ref: N9
    note: >-
      Reversal of 6c0e848 (fix-pass-3 item 0.5), which removed this
      block on the 4b baseline's 5/5. The fp3 re-run (engine bf7a3e1)
      is 4/5, failing exactly when file_paths is emitted (1 with, 4
