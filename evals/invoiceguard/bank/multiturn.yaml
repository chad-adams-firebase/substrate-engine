# Multi-turn anchor→pronoun rows (gate verdict §7.7) — continuation
# is proven live twice; these keep it proven. A row's turns share one
# engine conversation; the rep passes only if every turn passes.

- id: MT1
  provenance: user-sourced
  category: multiturn
  gold: gold/mt1_totals.py
  expected_gold: {total: 1990, march: 674, april: 682, may: 634}
  threshold: 0.8
  turns:
    - question: "How many invoices do we have in total?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: numeric_from_gold, field: total}
    - question: "How many of those arrived in each month?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: numeric_from_gold, field: march}
          - {kind: numeric_from_gold, field: april}
          - {kind: numeric_from_gold, field: may}
  note: >-
    Reconstructed from addendum §6 (the engine's first-ever
    multi-turn exchange; 674/682/634 verified there). Turn 2's
    "those" must resolve against turn 1 via the checkpointer.

