- id: MT4
  provenance: scripted
  category: multiturn
  gold: gold/mt4_summary_recall.py
  expected_gold:
    supplier: RVX01
    supplier_name: Ravenswood Extrusion
    total_invoice_amount: 1005028.40
    invoice_total: 1990
  threshold: 0.8
  # The summary live (Phase 5 Block 4): with a one-turn window and a
  # refresh every turn, turn 1 is folded into the running summary at
  # the end of turn 2, so turn 4's router sees turn 1 only through the
  # summary — a turn reference and the supplier's name, never the
  # figure — and must re-gather the figure with a tool.
  context: {last_n_turns: 1, summary_refresh_after_turns: 1}
  turns:
    - question: >-
        Which supplier has the highest total invoice amount? Tell me
        the supplier and the amount in a sentence.
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: name_from_gold, field: [supplier, supplier_name]}
          - {kind: numeric_from_gold, field: total_invoice_amount}
    - question: "How many invoices do we have in total?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: numeric_from_gold, field: invoice_total}
    - question: "What's the difference between the RECEIVED and READY statuses?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: route, mode: must_include_any_of, tools: [app_primer, lookup_data_dictionary]}
    - question: "What was that supplier's total invoice amount again?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: route, mode: must_include, tools: [run_sql]}
          - {kind: numeric_from_gold, field: total_invoice_amount}
          - {kind: summary_contains, pattern: "turn 1"}
          - {kind: summary_contains, from_gold_field: [supplier, supplier_name]}
          - {kind: summary_excludes_figures, from_turn: 0}
  note: >-
    Block 4's regression net for the summarizer prompt — model-facing
    text no other row reaches, since the pack's window is ten turns.
    Turn 1 is phrased for prose (a table would carry the name only in
    a cell the history never keeps); turns 2 and 3 are MT1's and
    PLAY-R1's questions, green on their own rows; turn 4's "that
    supplier" resolves only through the summary. The summary
    assertions read the summary turn 4 ends with (through turn 3).

# Backlog Pass (2026-09-04): the two wrong-but-verified outcomes of the
# developer's 30-turn browser session (gate verdict §5), reconstructed
# as rows so the class is regression-visible. Both are user-sourced:
# the questions are the session's own words.

- id: MT-KEY
  provenance: user-sourced
  category: multiturn
  gold: gold/mt_key_invoice_history.py
  expected_gold:
    invoice_number: INV-00426
    invoice_id: "440"
    invoice_total: 43117.71
    ties: 1
    transitions: 5
    day: "2026-03-20"
    actor: ava
  threshold: 0.8
  turns:
    - question: "Which invoice has the highest invoice total?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          # Either identifier names the invoice (Rider Pass): the number,
          # or the id a rep projects instead — both from the executed gold.
          - {kind: name_from_gold, field: [invoice_number, invoice_id], forbid_bare_ids: false}
          - {kind: numeric_from_gold, field: invoice_total}
    - question: "What was that invoice's history?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: route, mode: must_include, tools: [run_sql]}
          # The wrong-invoice sentinel: every transition of the anchored
          # invoice falls on the gold's `day`; any other day in the
          # answer is another invoice's history. A history query carries
          # no date literal, so the SQL caption cannot trip it.
          - {kind: not_contains, pattern: "2026-(?!03-20)\\d\\d-\\d\\d", regex: true}
          - {kind: pattern_count, pattern: "2026-03-20", from_gold_field: transitions, breach: false}
          - {kind: name_from_gold, field: actor, breach: false}
  note: >-
    Verdict §5, turns 19–20: "that invoice's history" ran
    `WHERE ih.invoice_id = 123 -- Replace 123 with the actual invoice
    ID` and returned another invoice's transitions, verified. Turn 1
    establishes one invoice by its number (the id never surfaces, as
    in the session); turn 2 must read that invoice's history. Breach
    semantics: wrong-invoice content at exit 0 — a transition on any
    day but the anchored invoice's — is wrong-but-verified, and the
    regex sentinel breaches; the transition count and the auditor are
    breach: false, since a rep that omits the timestamp or actor
    column is a miss, not a wrong answer. The regex's day and the About
    text are derived from the gold and pinned by expected_gold, so a
    world change rots the row rather than silently passing it.
    Threshold 0.8: the anchor turn's SQL shape varies (the model may or
    may not project the id), and a rep that overrides the key challenge
    ships [UNVERIFIED] — a miss, never a breach. Rider Pass: the
    post-fix-pass run's rep 1 answered turn 1 as {invoice_id,
    invoice_total} and tripped the alarm — a false alarm, the alarm's
    third: the id is a legal way to identify an invoice, and turn 2
    pulled the right history off it. The name assertion now reads
    either identifier, both from the executed gold. A general grading
    gate ("name absent but gold numeric matched → non-breach") was
    declined: it would someday mask a wrong entity wearing a
    coincidentally right number. Per-instance fixes stay in the bank.

- id: MT-ANCHOR
  provenance: user-sourced
  category: multiturn
  gold: gold/mt_anchor_rule.py
  expected_gold:
    rule: line_note
    fire_count: 505
    wrong_rule: new_supplier
    wrong_count: 197
  threshold: 0.8
  turns:
    - question: "Which rule fires most often?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: name_from_gold, field: rule}
          - {kind: numeric_from_gold, field: fire_count}
    - question: "Tell me more about that rule."
      expect:
        # An honest refusal is allowed: line_note has no rules-engine
        # function and no business doc. What is not allowed is an answer
        # about another rule, or a clarify — the transcript names it.
        exit: [0, 2, 3]
        assertions:
          # The mechanism assertion this row exists for: the About line
          # the answer declares (or the anchor check would have caught).
          # An About may wear its kind noun ("rule line_note") since the
          # Fix Pass's strip-and-match; the bank accepts what the engine does.
          # Rider Pass: both stand down only on a turn the anchor check
          # warned — the caught drift ships [UNVERIFIED] with the warn and
          # passes; a wrong About at exit 2 WITHOUT the warn is the check
          # going silent and fails the rep; at exit 0 a wrong About breaches.
          - {kind: contains, pattern: "About: (?:(?:the|a|an) )?(?:(?:audit |compliance )?rule )?line_note\\.", regex: true, at_exit: [0, 2], unless_finding: anchor.entity_mismatch}
          - {kind: not_contains, pattern: new_supplier, at_exit: [0, 2], unless_finding: anchor.entity_mismatch}
    - question: "How many findings has it produced?"
      expect:
        # Exit 2 is the caught drift (Rider Pass): after a turn-2 warn,
        # "it" is read against the surviving anchor and another rule's
        # count ships [UNVERIFIED] with the warn. 197 at exit 0 stays the
        # breach sentinel; 197 at exit 2 without the warn fails the rep.
        exit: [0, 2]
        assertions:
          - {kind: nonempty}
          - {kind: numeric_from_gold, field: fire_count, unless_finding: anchor.entity_mismatch}
  note: >-
    Verdict §5, turns 6–9: turn 6 named line_note in a one-row table,
    the router saw only its SQL in the history, and turns 7 and 9
    answered about new_supplier — verified. Turn 1 is the session's
    turn 6; turn 2 asks about "that rule" and must be about line_note;
    turn 3 is the session's turn 9 with executed gold. Breach
    semantics: an About line naming a rule other than the anchor's, or
    new_supplier anywhere in the answer, at exit 0 or 2 is the drift
    and not_contains breaches at exit 0; turn 3's count of any other
    rule (197 is new_supplier's) at exit 0 is a contradicted breach.
    A turn-2 refusal is not drift and passes. Threshold 0.8: turn 2's
    answer source is open (the CKG constant, the dictionary, a
    re-query) and a rep may clarify instead, which is a miss. Fix Pass:
    the post-backlog run breached here (rep 4: turn 2 warned, turn 3
    counted new_supplier, 197 verified) because the warned drift
    became turn 3's anchor; now a warned turn establishes nothing, its
    transcript carries the correction, and "it" is read against the
    surviving anchor — a drifting turn 3 ships [UNVERIFIED], a miss,
    never 197 at exit 0. Rider Pass: the post-fix-pass run showed both
    designed outcomes — rep 4 warned at turn 2 and recovered 505 at
    turn 3; rep 5 warned at turn 2 and turn 3's 197 shipped
    [UNVERIFIED] through the window — against assertions that predated
    the machinery, 3/5. The content assertions now stand down only on
    a turn whose verdict carries anchor.entity_mismatch. The encoding
    in one line: wrong-count-verified breaches; wrong-count-caught
    passes.

- id: MT-ABOUT
  provenance: scripted
  category: multiturn
  gold: gold/mt_about_rate_variance.py
  expected_gold:
    rule: rate_variance
    fire_count: 383
    supplier: RVX01
    supplier_name: Ravenswood Extrusion
    supplier_count: 257
    runner_up: QUILL8
    rule_function: invoiceguard.spine.rules_engine.rule_rate_variance
  threshold: 0.8
  turns:
    - question: "How many findings has the rate_variance rule produced?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: numeric_from_gold, field: fire_count}
    - question: "Tell me more about that rule."
      expect:
        # The positive path MT-ANCHOR never showed (its turn 2 passed
        # 0/5 by answering): this rule has evidence — the threshold
        # memo and the CKG rule function — so a refusal is a miss here.
        exit: [0, 2]
        assertions:
          - {kind: nonempty}
          - {kind: contains, pattern: "About: (?:(?:the|a|an) )?(?:(?:audit |compliance )?rule )?rate_variance\\.", regex: true, at_exit: [0, 2]}
          # An About naming anything but the anchor is the drift.
          - {kind: not_contains, pattern: "About: (?!(?:(?:the|a|an) )?(?:(?:audit |compliance )?rule )?rate_variance\\.)", regex: true, at_exit: [0, 2]}
          # Content from the evidence: the memo and the docstring both
          # describe the rule against the contract rate.
          - {kind: contains, pattern: "contract", at_exit: [0, 2]}
    - question: "Which supplier does it flag most often?"
      expect:
        exit: [0]
        assertions:
          - {kind: nonempty}
          - {kind: route, mode: must_include, tools: [run_sql]}
          - {kind: name_from_gold, field: [supplier, supplier_name]}
          - {kind: numeric_from_gold, field: supplier_count, breach: false}
  note: >-
    Fix Pass R4: MT-ANCHOR's turn-2 success path was observed 0/5 —
    line_note has no memo and no rules-engine function, so the
    feature's showcase (a follow-up answer wearing its About line)
    passed only via refusals. This row anchors a rule that has both.
    Turn 1's filter on rule_name establishes rate_variance; turn 2
    must answer about it — an About naming any other rule at exit 0
    breaches (not_contains), the same at exit 2 or a refusal fails the
    rep as a miss; turn 3 asks about "it" on the clean path, where the
    pronoun window is closed and the anchor check is silent — another
    supplier at exit 0 is the drift-class breach (name_from_gold), a
    rep that names the supplier without its count is a miss. Threshold
    0.8: turn 2's answer source is open (the memo, the docstring, both)
    and a rep may clarify instead. Every figure from executed gold.
