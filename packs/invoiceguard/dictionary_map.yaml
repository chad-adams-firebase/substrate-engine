# Data Dictionary Map — the semantic/routing layer over the dictionary
# (Brief §4.2). This whole artifact is run_sql's grounding payload
# (Brief §7). Authored from invoice-guard docs/functional-spec.md and
# docs/planted-stories.md at commit 761a18e9; validated through use.
#
# Note on metric names: InvoiceGuard itself defines no "flag rate" or
# "audit yield". Its spec metrics are queue health, auditor
# performance, and the production rollup. flag_rate and
# recovered_opportunity below are engine-side canonical definitions
# (the audit-yield analog is recovered_opportunity), authored here and
# flagged needs_validation until humans confirm them through use.
provenance:
  source: machine
  confidence: 0.5
  needs_validation: true
  note: >-
    Authored from invoice-guard docs/functional-spec.md and
    docs/planted-stories.md at commit 761a18e9; to be human-validated
    through use. Entries added later by hand carry their own
    provenance block (source: human) overriding this document
    default.

concepts:
  - name: invoice lifecycle
    definition: >-
      An invoice moves RECEIVED -> READY -> CLAIMED -> IN_REVIEW ->
      CLOSED or NO_REVIEW_NEEDED; unworked invoices past the lapse
      window become LAPSED. Every transition is a row in
      invoice_history (from_status, to_status, actor, at); the
      invoices table stores only the current status.
    tables: [invoices, invoice_history]
    synonyms: [status, queue state]
  - name: finding
    definition: >-
      One rule hit on an invoice (or one of its lines). rule_name is
      the rule that fired (rate_variance, total_mismatch, ...;
      compliance findings are named compliance_<rule code>); category
      routes it to a team (MATERIAL/SERVICE/FEE/COMPLIANCE/CORRECTION/
      CREEPBACK/NOTE); amount is the dollar impact, NULL for flat
      flag-style findings.
    tables: [findings, finding_feedback]
    synonyms: [flag, rule hit]
  - name: opportunity
    definition: >-
      The recovery dollars an audit of this invoice might yield —
      the sum of effective finding amounts plus (when larger than the
      service findings) the benchmark service-hours delta priced at
      the contract labor rate. Stored on invoices.opportunity by the
      roll-up.
    tables: [invoices]
    synonyms: [recovery opportunity, dollars on the table, savings, productivity]
  - name: weight
    definition: >-
      Queue priority: opportunity-derived, multiplied for creep-back
      (x2) and ignored corrections (x5), boosted flat for critical
      compliance, then divided by invoice total — density of
      opportunity per review hour, not raw dollars. Stored on
      invoices.weight.
    tables: [invoices]
    synonyms: [priority, score]
  - name: revision chain
    definition: >-
      A resubmitted invoice arrives as a new row with the same
      (supplier_id, invoice_number) and revision + 1, linked by
      prior_revision_id. supplier_acceptance records whether the
      supplier ACCEPTED or REJECTED the prior review's requested
      changes.
    tables: [invoices]
    synonyms: [resubmission]
  - name: creep-back
    definition: >-
      A supplier accepts a corrected rate on one revision, then
      quietly drifts the price back up on a later one. Detected by
      the creepback scan; lands as CREEPBACK findings and doubles the
      invoice's weight multiplier.
    tables: [findings, invoices]
    synonyms:
      - creepback
      - creep back
      - raised prices back up
      - reinflation
      - price creep
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Synonyms hand-authored from the 2026-08-31 play session (S6:
        manager phrasings never reached this concept).
  - name: lapse
    definition: >-
      Invoices still RECEIVED/READY past the lapse window
      (lapse_after_days, default 6, plus one fixed grace day) are
      swept to LAPSED by the daily stale sweep — unless protected by
      a critical compliance score (invoices.compliance_score >= 1500).
    tables: [invoices, invoice_history]
    synonyms: [stale, expiry]
  - name: network supplier
    definition: >-
      suppliers.network = 1 means in-network: their invoices enter the
      audit pipeline. Out-of-network suppliers' invoices are born
      LAPSED (out of audit scope), not scored. Those invoices carry NULL
      invoice_total and no invoice_lines — a total over them is NULL
      (no data, rendered as a dash), never $0 — and two suppliers have
      no invoices at all.
    tables: [suppliers, invoices, invoice_lines]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        NULL-total sentence hand-authored from the 2026-09-02 play
        session (F1: six no-data suppliers rendered as $0.00).
  - name: audit rules
    definition: >-
      "Rules" has three senses. (1) The 12 audit rules in the rules
      engine's code — every one runs on every scored invoice, so "how
      many rules run on an invoice" is 12, answered from the
      primer/CKG, not SQL. (2) Compliance rule codes —
      compliance_rules rows, severity-bearing, arriving as
      compliance_<code> findings; 10 distinct rule codes in this
      data. (3) findings.rule_name values — the rules that actually
      FIRED (26 distinct values, since compliance findings arrive as
      compliance_<code>). Counting compliance_reports per invoice
      answers none of these.
    tables: [findings, compliance_rules]
    synonyms: [rules, audit rule]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-08-31 play session (W5: rules-per-
        invoice counted compliance_reports; W6: rule averages read the
        wrong grain).

  - name: review report
    definition: >-
      An auditor's correction request on a closed invoice. One
      review_reports row per reviewed invoice (review_reports.invoice_id
      is the invoice that was audited — the PRIOR revision once a
      resubmission exists) and one review_report_lines row per line the
      auditor wants changed. disposition is the AUDITOR's verdict on the
      invoice — APPROVED or CORRECTIONS_REQUESTED — and says nothing
      about what the supplier did (that is invoices.supplier_acceptance;
      see supplier response). A review with no corrections is APPROVED,
      so APPROVED is rare by construction. Lines have no kind column: a
      RATE correction has requested_rate set and remove_requested = 0; a
      REMOVAL has remove_requested = 1. requested_rate is a dollar unit
      rate — always the supplier's active contract rate for the line's
      item — never a percentage.
    tables: [review_reports, review_report_lines, invoices]
    synonyms:
      - corrections we request
      - corrections we requested
      - requested corrections
      - correction request
      - correction requests
      - audit adjustments
      - what we asked them to change
      - auditor corrections
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.
  - name: supplier response
    definition: >-
      What the supplier did about a review — recorded on the invoices
      table, in two places, and nowhere else (there is no
      supplier_acceptance table and no revisions table). (1) The
      successor revision: a resubmission is a new invoices row with the
      same supplier_id and invoice_number, revision + 1, and
      prior_revision_id pointing at the reviewed invoice; its
      invoice_lines are what the supplier actually billed after the
      review. (2) invoices.supplier_acceptance on the REVIEWED (prior)
      invoice: ACCEPTED when every requested correction was applied on
      the successor, REJECTED when any one was ignored — written only
      when a successor arrives, so a review that never drew a
      resubmission leaves it NULL. About 40% of reviews never draw a
      resubmission: NULL is "no response yet", not a rejection, and
      absence of a revision is not refusal.
    tables: [invoices, invoice_lines]
    synonyms:
      - supplier acceptance
      - accepted the correction
      - accepted our corrections
      - applied the correction
      - applied the corrections
      - ignored the correction
      - ignored our corrections
      - resubmitted invoice
      - did they fix it
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.

metrics:
  - name: flag_rate
    description: >-
      Share of invoices with at least one finding. Engine-defined:
      InvoiceGuard stores findings but names no such rate.
    tables: [invoices, findings]
    filter_sql: ""
    aggregation_sql: >-
      COUNT(DISTINCT f.invoice_id) * 1.0 / (SELECT COUNT(*) FROM invoices)
    notes: >-
      Join findings f ON f.invoice_id = invoices.id. For a
      "substantive" variant exclude bookkeeping rows with
      f.category NOT IN ('NOTE'). Window on invoices.received_at.
  - name: item_flag_rate
    description: >-
      Share of a given item code's lines flagged by a given rule —
      the shape behind "is item X usually flagged?".
    tables: [invoice_lines, findings]
    filter_sql: "l.item_code = :item_code"
    aggregation_sql: >-
      AVG(CASE WHEN f.id IS NOT NULL THEN 1.0 ELSE 0.0 END)
    notes: >-
      LEFT JOIN findings f ON f.invoice_id = l.invoice_id AND
      f.line_number = l.line_number AND f.rule_name = :rule_name.
      Line-level findings join on BOTH invoice_id and line_number.
  - name: recovered_opportunity
    description: >-
      Opportunity dollars on completed reviews, per team per day —
      the audit-yield analog, matching the app's production-rollup
      dashboard exactly.
    # Whole-phrase matched against the question (Polish Pass): the
    # play-session question "how much savings have they realized?"
    # reached only rule_savings through "savings", and the answer
    # never named its reading. No bare "saved" — common enough to pull
    # the metric into unrelated questions ("saved to the queue").
    synonyms:
      - savings realized
      - realized savings
      - realized
      - savings per auditor
      - auditor savings
      - how much has each auditor saved
    tables: [invoice_history, users, invoices]
    filter_sql: "invoice_history.to_status IN ('CLOSED', 'NO_REVIEW_NEEDED')"
    aggregation_sql: "SUM(COALESCE(invoices.opportunity, 0))"
    notes: >-
      JOIN users ON users.short_name = invoice_history.actor JOIN
      invoices ON invoices.id = invoice_history.invoice_id; GROUP BY
      users.team, DATE(invoice_history.at). This mirrors the app's
      PRODUCTION_ROLLUP_SQL (platform/api/teams.py).
    interpretations:
      - name: closed-invoice opportunity
        meaning: >-
          SUM(invoices.opportunity) over reviews the auditor
          completed — the app's production rollup, the default.
      - name: closed-invoice findings
        meaning: >-
          effective finding amounts (valid exceptions zeroed) on
          invoices the auditor closed.
      - name: feedback-authored findings
        meaning: >-
          effective finding amounts where the auditor authored the
          finding_feedback row.
  - name: rule_savings
    description: >-
      Effective savings each rule has produced — finding amounts with
      valid exceptions zeroed, the app's own accounting. Engine-
      defined; the "which rule saves the most / is most productive"
      question.
    tables: [findings, finding_feedback]
    synonyms:
      - savings
      - most savings
      - savings by rule
      - productive
      - most productive
      - opportunity by rule
      - recovery by rule
    filter_sql: ""
    aggregation_sql: >-
      SUM(CASE WHEN ff.valid_exception = 1 THEN 0 ELSE COALESCE(f.amount, 0) END)
    template_sql: |
      SELECT f.rule_name,
             SUM(CASE WHEN ff.valid_exception = 1 THEN 0 ELSE COALESCE(f.amount, 0) END) AS effective_savings
      FROM findings f
      LEFT JOIN finding_feedback ff ON ff.finding_id = f.id
      GROUP BY f.rule_name
      ORDER BY effective_savings DESC
    notes: >-
      The LEFT JOIN is mandatory: filtering ff.valid_exception in the
      WHERE clause turns it into an INNER JOIN and drops every finding
      without a feedback row — the inversion the 4b baseline caught
      (duplicate_line $11K instead of quantity_spike $610K). Zero the
      excepted rows inside the SUM, never in WHERE. Per-rule AVERAGES
      are finding-level: AVG over findings.amount, never
      AVG(invoices.opportunity) across a join — invoice-level values
      are inflated by every other rule on the same invoice (1.5–25×
      in the play session).
    interpretations:
      - name: finding-level
        meaning: >-
          SUM/AVG over findings.amount — the dollars the rule's own
          findings carry; the default.
      - name: invoice-level
        meaning: >-
          aggregates over invoices.opportunity for invoices the rule
          touched — inflated by every co-occurring rule; name it if
          deliberately used.
  - name: queue_backlog
    description: >-
      The READY backlog awaiting audit: count, total opportunity,
      total weight (the app's queue-health dashboard).
    tables: [invoices]
    filter_sql: "invoices.status = 'READY'"
    aggregation_sql: >-
      COUNT(*), SUM(COALESCE(invoices.opportunity, 0)),
      SUM(COALESCE(invoices.weight, 0))
    notes: >-
      The app splits this per team by mapping finding categories to
      teams via config.values_json team_to_categories — a JSON config
      lookup, not a column; per-team splits need that mapping.
  - name: creepback_suppliers
    description: >-
      Suppliers caught creeping prices back up — the creepback scan's
      own findings, already net of acceptance history.
    tables: [findings, invoices, suppliers]
    synonyms:
      - who crept back
      - raised prices back up after accepting
      - reinflated prices
      - crept back up
    filter_sql: "f.rule_name LIKE '%creepback%'"
    aggregation_sql: "COUNT(*)"
    template_sql: |
      SELECT s.code, s.name, COUNT(*) AS creepback_findings
      FROM findings f
      JOIN invoices i ON i.id = f.invoice_id
      JOIN suppliers s ON s.id = i.supplier_id
      WHERE f.rule_name LIKE '%creepback%'
      GROUP BY s.code, s.name
      ORDER BY creepback_findings DESC
    notes: >-
      The scan has already verified the accept-then-drift pattern
      before writing the finding. Layering supplier_acceptance,
      review_reports.disposition, or invoice_history predicates on
      top re-tests what the finding already proves and
      self-annihilates to zero rows (S6: five reps, five empty
      results). The findings ARE the creep-back population.
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-08-31 play session; lands the
        fix-pass-4 residuals queue's S6 grounding fix.
  - name: auditor_throughput
    description: >-
      Claims and completed reviews per auditor over a half-open
      [start, end) window (the app's auditor-performance dashboard).
    tables: [invoice_history, users]
    filter_sql: "invoice_history.at >= :start AND invoice_history.at < :end"
    aggregation_sql: >-
      SUM(CASE WHEN invoice_history.to_status = 'CLAIMED' THEN 1 ELSE 0 END),
      SUM(CASE WHEN invoice_history.to_status IN ('CLOSED', 'NO_REVIEW_NEEDED')
          THEN 1 ELSE 0 END)
    notes: >-
      JOIN users ON users.short_name = invoice_history.actor; GROUP BY
      invoice_history.actor. System actors (system.rollup,
      system.stale-sweep, system.line-mapping) are not auditors —
      filter users.role = 'auditor'.

  - name: requested_rate_is_contract_rate
    description: >-
      The rate auditors ask suppliers to correct to — a dollar unit rate
      (review_report_lines.requested_rate), and always the supplier's
      active contract rate for the line's item. The answer to "what rate
      do they ask for" is "the contract rate", shown as the count of
      rate corrections that match it beside the total, or as the
      requested rates themselves. Not a percentage of anything.
    tables: [review_report_lines, review_reports, invoices, invoice_lines, contracts]
    synonyms:
      - what rate do they ask for
      - what rate do auditors ask for
      - rate do they ask for
      - rate auditors request
      - rate we request
      - requested rate
      - corrected rate
      - rate they ask suppliers to charge
    filter_sql: "rrl.requested_rate IS NOT NULL AND rrl.remove_requested = 0"
    aggregation_sql: >-
      COUNT(DISTINCT rrl.id), COUNT(DISTINCT CASE WHEN c.contract_rate =
      rrl.requested_rate THEN rrl.id END)
    template_sql: |
      SELECT COUNT(DISTINCT rrl.id) AS rate_corrections,
             COUNT(DISTINCT CASE WHEN c.contract_rate = rrl.requested_rate THEN rrl.id END) AS at_contract_rate,
             MIN(rrl.requested_rate) AS lowest_requested_rate,
             MAX(rrl.requested_rate) AS highest_requested_rate
      FROM review_report_lines rrl
      JOIN review_reports rr ON rr.id = rrl.review_report_id
      JOIN invoices inv ON inv.id = rr.invoice_id
      JOIN invoice_lines il ON il.invoice_id = inv.id AND il.line_number = rrl.line_number
      LEFT JOIN contracts c ON c.supplier_id = inv.supplier_id
                           AND c.item_code = il.item_code
                           AND c.effective_to IS NULL
      WHERE rrl.requested_rate IS NOT NULL AND rrl.remove_requested = 0
    notes: >-
      contracts is versioned — several rows per (supplier_id, item_code);
      c.effective_to IS NULL pins the active one, otherwise the join
      doubles the superseded pairs. COUNT(DISTINCT rrl.id), never
      COUNT(*), over these joins.
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.
  - name: correction_application_rate
    description: >-
      Share of requested corrections the supplier actually applied on the
      resubmission. Population: review_report_lines whose reviewed
      invoice has a successor revision — a correction never resubmitted
      against cannot be judged and is not "ignored". Applied: for a RATE
      correction the successor's same-numbered line bills exactly
      requested_rate or is gone; for a REMOVAL the line is gone. The
      ignored lines are exactly the correction_ignored findings, so
      applied + ignored = population and the three figures agree.
    tables: [review_report_lines, review_reports, invoices, invoice_lines]
    synonyms:
      - apply the corrections we request
      - apply our corrections
      - corrections applied
      - applied corrections
      - correction application
      - marked as applied
      - act on our corrections
      - comply with corrections
      - correction compliance
    filter_sql: ""
    aggregation_sql: >-
      SUM(CASE WHEN <the successor line applied the correction> THEN 1
      ELSE 0 END) * 1.0 / COUNT(*)
    template_sql: |
      SELECT COUNT(*) AS corrections_with_resubmission,
             SUM(CASE WHEN NOT EXISTS (
                        SELECT 1 FROM invoice_lines sl
                        WHERE sl.invoice_id = succ.id
                          AND sl.line_number = rrl.line_number
                          AND (rrl.remove_requested = 1
                               OR sl.unit_rate <> rrl.requested_rate))
                      THEN 1 ELSE 0 END) AS corrections_applied,
             SUM(CASE WHEN NOT EXISTS (
                        SELECT 1 FROM invoice_lines sl
                        WHERE sl.invoice_id = succ.id
                          AND sl.line_number = rrl.line_number
                          AND (rrl.remove_requested = 1
                               OR sl.unit_rate <> rrl.requested_rate))
                      THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS application_rate
      FROM review_report_lines rrl
      JOIN review_reports rr ON rr.id = rrl.review_report_id
      JOIN invoices inv ON inv.id = rr.invoice_id
      JOIN invoices succ ON succ.prior_revision_id = inv.id
    notes: >-
      The successor line is tested with NOT EXISTS, not a LEFT JOIN — the
      composite line join is the shape the fan-out check challenges.
      review_reports.disposition is the auditor's verdict and answers
      nothing about the supplier (APPROVED / all reviews = 1/109 in this
      data — the wrong answer). application_rate is a fraction; the UI
      renders it as a percentage.
    interpretations:
      - name: per correction
        meaning: >-
          correction lines applied / correction lines with a
          resubmission — the default (55/73 here).
      - name: per review
        meaning: >-
          reviews whose resubmission applied everything
          (invoices.supplier_acceptance = 'ACCEPTED') / reviews with a
          resubmission (supplier_acceptance IS NOT NULL) — 44/61 here;
          name it if used.
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.
  - name: corrections_ignored_by_supplier
    description: >-
      How many requested corrections each supplier ignored on its
      resubmission — the app's own correction_ignored findings, one per
      ignored correction line, written on the SUCCESSOR invoice (amount
      0, category CORRECTION).
    tables: [findings, invoices, suppliers]
    synonyms:
      - ignores our corrections
      - ignored our corrections
      - ignores corrections
      - ignored corrections
      - corrections ignored
      - ignored the most corrections
      - disregards our corrections
      - did not apply corrections
    filter_sql: "f.rule_name = 'correction_ignored'"
    aggregation_sql: "COUNT(*)"
    template_sql: |
      SELECT s.code, s.name, COUNT(*) AS corrections_ignored
      FROM findings f
      JOIN invoices i ON i.id = f.invoice_id
      JOIN suppliers s ON s.id = i.supplier_id
      WHERE f.rule_name = 'correction_ignored'
      GROUP BY s.code, s.name
      ORDER BY corrections_ignored DESC, s.code
    notes: >-
      The finding is the unit and already encodes the applied-vs-ignored
      comparison. Counting reviewed invoices that were never ACCEPTED
      counts the ~40% of reviews that drew no resubmission as ignored
      (28 for the leading supplier where 9 corrections were ignored, in
      a world with 18 ignored corrections in total). Counting invoices
      with supplier_acceptance = 'REJECTED' counts resubmissions, not
      corrections (one resubmission can ignore two). Use the findings.
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.
  - name: corrections_ignored_by_auditor
    description: >-
      Ignored corrections attributed to the auditor who requested them.
      Neither findings nor review_reports carry a reviewer column: the
      requesting auditor is the actor who CLOSED the reviewed (prior)
      revision — from the correction_ignored finding's invoice (the
      successor) to its prior_revision_id, then that prior's
      invoice_history row with to_status = 'CLOSED' (exactly one per
      invoice). actor is a users.short_name.
    tables: [findings, invoices, invoice_history, users]
    synonyms:
      - audit rejections by reviewer
      - audit rejections
      - rejections by reviewer
      - rejections by auditor
      - ignored corrections by auditor
      - ignored corrections by reviewer
      - corrections ignored per auditor
    filter_sql: "f.rule_name = 'correction_ignored' AND h.to_status = 'CLOSED'"
    aggregation_sql: "COUNT(*)"
    template_sql: |
      SELECT x.reviewer, COUNT(*) AS corrections_ignored
      FROM (
        SELECT (SELECT h.actor FROM invoice_history h
                WHERE h.invoice_id = prior.id AND h.to_status = 'CLOSED') AS reviewer
        FROM findings f
        JOIN invoices i ON i.id = f.invoice_id
        JOIN invoices prior ON prior.id = i.prior_revision_id
        WHERE f.rule_name = 'correction_ignored'
      ) x
      GROUP BY x.reviewer
      ORDER BY corrections_ignored DESC, x.reviewer
    notes: >-
      "Rejection" here is the supplier rejecting the auditor's correction
      — the default reading. There is no REJECTED invoice status:
      invoice_history.to_status holds only the seven lifecycle states and
      review_reports.disposition only APPROVED / CORRECTIONS_REQUESTED.
      The closer is looked up in a scalar subquery so the aggregate
      scope carries no join to invoice_history. Join users on
      users.short_name = reviewer for names or teams.
    interpretations:
      - name: ignored corrections
        meaning: >-
          correction_ignored findings per requesting auditor — the
          supplier rejected the correction; the default.
      - name: corrections requested
        meaning: >-
          review_reports with disposition = 'CORRECTIONS_REQUESTED' per
          auditor who closed the reviewed invoice — the auditor rejected
          the invoice as billed; name it if used.
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.

join_paths:
  - name: invoices_to_lines
    steps:
      - {from_table: invoices, from_column: id, to_table: invoice_lines, to_column: invoice_id}
  - name: invoices_to_findings
    steps:
      - {from_table: invoices, from_column: id, to_table: findings, to_column: invoice_id}
    notes: Invoice-level findings have line_number NULL.
  - name: lines_to_findings
    steps:
      - {from_table: invoice_lines, from_column: invoice_id, to_table: findings, to_column: invoice_id}
      - {from_table: invoice_lines, from_column: line_number, to_table: findings, to_column: line_number}
    notes: >-
      Composite join — line-level findings match on BOTH columns;
      joining on invoice_id alone cross-multiplies lines with the
      invoice's other findings.
  - name: findings_to_feedback
    steps:
      - {from_table: findings, from_column: id, to_table: finding_feedback, to_column: finding_id}
    cardinality: one_to_one
    notes: At most one feedback row per finding (finding_id is unique).
  - name: invoices_to_suppliers
    steps:
      - {from_table: invoices, from_column: supplier_id, to_table: suppliers, to_column: id}
  - name: invoices_to_claimer
    steps:
      - {from_table: invoices, from_column: claimed_by, to_table: users, to_column: id}
    notes: >-
      claimed_by is a user id; invoice_history.actor is a user
      short_name (string) — two different keys for people.
  - name: invoices_to_history
    steps:
      - {from_table: invoices, from_column: id, to_table: invoice_history, to_column: invoice_id}
    # One row per invoice under any of these filters (Close Pass):
    # executed against the world by `engine eval grade --check-gold`,
    # so the fact is a tripwire, not a coincidence of the fixture.
    one_to_one_when:
      - {column: invoice_history.to_status, values: [CLOSED, NO_REVIEW_NEEDED]}
      - {column: invoice_history.to_status, values: [RECEIVED]}
      - {column: invoice_history.from_status, values: [RECEIVED]}
    notes: >-
      One row per invoice under any of these filters: an invoice is
      received once (its creation transition; a resubmission is a new
      invoice) and reaches one terminal status once. Unfiltered,
      several transitions share one invoice.
  - name: suppliers_to_contracts
    steps:
      - {from_table: suppliers, from_column: id, to_table: contracts, to_column: supplier_id}
    notes: >-
      The active contract for a line also matches item_code and the
      date window effective_from <= at < effective_to (open-ended
      when effective_to is NULL); several revisions of a contract can
      exist per (supplier, item).
  - name: invoices_to_compliance
    steps:
      - {from_table: invoices, from_column: id, to_table: compliance_reports, to_column: invoice_id}
      - {from_table: compliance_reports, from_column: id, to_table: compliance_rules, to_column: compliance_report_id}
    notes: >-
      Compliance findings (rule_name compliance_<code>) correspond
      one-to-one to compliance_rules rows, whose severity is the
      authority. Joining findings to compliance_rules through
      invoice_id pairs every finding with every rule on the invoice —
      count compliance_rules directly for severity questions.

  - name: invoice_to_successor
    steps:
      - {from_table: invoices, from_column: id, to_table: invoices, to_column: prior_revision_id}
    cardinality: one_to_one
    notes: >-
      succ.prior_revision_id = inv.id, a self-join. A reviewed invoice
      has at most one successor (UNIQUE supplier_id, invoice_number,
      revision; a resubmission is revision + 1), so the join multiplies
      rows in neither direction. The successor carries the
      correction_ignored findings; the prior carries supplier_acceptance.
  - name: reviews_to_invoices
    steps:
      - {from_table: review_reports, from_column: invoice_id, to_table: invoices, to_column: id}
    notes: The reviewed invoice — the prior revision once a resubmission exists.
  - name: review_lines_to_reviews
    steps:
      - {from_table: review_report_lines, from_column: review_report_id, to_table: review_reports, to_column: id}
  - name: review_lines_to_billed_lines
    steps:
      - {from_table: review_report_lines, from_column: line_number, to_table: invoice_lines, to_column: line_number}
    notes: >-
      Composite — always AND an invoice: il.invoice_id = the reviewed
      invoice (what was billed before the review) or = its successor
      (what was billed after). line_number alone repeats on every
      invoice. Inside an aggregate, test the successor line with EXISTS /
      NOT EXISTS (the correction_application_rate template) rather than
      a LEFT JOIN the fan-out check will challenge.
  - name: successor_to_requesting_auditor
    steps:
      - {from_table: invoices, from_column: prior_revision_id, to_table: invoices, to_column: id}
      - {from_table: invoices, from_column: id, to_table: invoice_history, to_column: invoice_id}
    notes: >-
      Filter invoice_history.to_status = 'CLOSED' — one row per invoice,
      the auditor who closed the review; actor is a users.short_name.
      Neither findings nor review_reports name a reviewer.

gotchas:
  - name: adjustment_totals
    summary: >-
      invoice_total legitimately differs from the sum of lines when
      adjustments exist — a silent mismatch is not an error.
    detail: >-
      When invoices.adjustment_flag = 1, the stated invoice_total is
      deliberately below SUM(invoice_lines.extended_price) (supplier-
      side credits and adjustments, typically 50-500), and the
      total_mismatch rule deliberately stays silent. A separate,
      smaller population carries genuine unexplained mismatches
      (typically 5-50) with adjustment_flag = 0, and those ARE
      flagged as total_mismatch findings. Never validate
      invoice_total against the line sum without checking
      adjustment_flag first. To count the silent-adjustment
      population: SELECT COUNT(*) FROM invoices i WHERE
      i.adjustment_flag = 1 AND ABS(i.invoice_total - (SELECT
      SUM(l.extended_price) FROM invoice_lines l WHERE l.invoice_id =
      i.id)) > 0.01 AND NOT EXISTS (SELECT 1 FROM findings f WHERE
      f.invoice_id = i.id AND f.rule_name = 'total_mismatch').
    tables: [invoices, invoice_lines, findings]
  - name: data_coverage
    summary: >-
      The data covers 2026-03-02 through 2026-05-30 — never use
      date('now') or CURRENT_DATE in queries.
    detail: >-
      This is a simulated world: activity runs 2026-03-02 to
      2026-05-30 and nothing is newer. Relative phrases like "last
      week" anchor to the data's end (the last received_at day is
      2026-05-29; scheduled tasks run through 2026-05-30), not to
      today. For received_at windows last_day is 2026-05-29 (the
      05-30 in the coverage line is scheduled-task activity). A
      relative window of N days ends on that last day, inclusive, as
      a half-open range [last_day - N + 1, last_day + 1): "last 7
      days" / "last week" / "this week" are all received_at >=
      '2026-05-23 00:00:00' AND received_at < '2026-05-30 00:00:00'
      — a week is always this trailing window, never a calendar
      (Sun–Sat or Mon–Sun) week, because the last day falls mid-week
      and week-start conventions differ; "last 30 days" is
      received_at >= '2026-04-30 00:00:00' AND received_at <
      '2026-05-30 00:00:00'. "This month" is the calendar month
      containing the last day — the reporting unit, and complete,
      since 2026-05-29 is May's last business day: received_at >=
      '2026-05-01 00:00:00' AND received_at < '2026-06-01 00:00:00'.
      Windows on invoice_history.at and compliance_reports.issued_at
      anchor the same way. Invoices arrive on business days only —
      weekends have no received_at values, though daily sweeps still
      log.
    tables: [invoices, findings, invoice_history]
  - name: naive_datetime_strings
    summary: >-
      Datetimes are naive-UTC strings; booleans are 0/1 integers.
    detail: >-
      Datetime columns store 'YYYY-MM-DD HH:MM:SS.ffffff' with no
      timezone (UTC by convention). Compare against full string
      literals ('2026-05-23 00:00:00' works; date('now') does not
      belong here at all). Boolean columns (adjustment_flag,
      rush_flag, is_credit_memo, disputed_hold, network, available)
      store 0/1.
    tables: [invoices, suppliers, users]
  - name: null_amount_findings
    summary: >-
      findings.amount is NULL for flat flag-style findings — SUM over
      amounts silently skips them, and excepted findings still carry
      their original amount.
    detail: >-
      Flag-style rules (new_supplier, split_billing, line_note) write
      amount NULL: they mark risk, not dollars. And when an auditor
      marks a finding a valid exception (finding_feedback.
      valid_exception = 1), the app treats its effective amount as 0
      — but findings.amount keeps the original value. Dollar
      aggregations that should reflect the app's numbers must
      LEFT JOIN finding_feedback and zero out excepted rows.
    tables: [findings, finding_feedback]
  - name: rate_needs_unflagged_side
    summary: >-
      A rate over a population needs the unflagged side —
      COALESCE(indicator, 0) (or a CASE) so AVG doesn't silently skip
      NULLs and saturate to 1.0.
    detail: >-
      "Usually", "share of", "what rate" questions divide by the
      WHOLE population, but building the indicator via a LEFT JOIN
      leaves unmatched rows NULL, and AVG skips NULLs — every
      unflagged line vanishes from the denominator and the rate
      saturates to exactly 1.0 (the pin pass's S2: 1.0 reported where
      the true rate was 63/66). Make the unflagged side an explicit
      0: AVG(COALESCE(indicator, 0)), or SUM(CASE WHEN <match> THEN 1
      ELSE 0 END) * 1.0 / COUNT(*) over the population rows in ONE
      scope — never a COUNT of matches in one query divided by a COUNT
      of the population in another: a scalar-subquery pair or two
      joined COUNTs is the fan-out shape the lint challenges and the
      Verifier marks unverified (the post-Block-2 S2 overrides, and rep
      5's 1.0476 = 66 lines under a fanned 69). The indicator itself is
      CASE WHEN EXISTS (SELECT 1 FROM findings f WHERE f.invoice_id =
      l.invoice_id AND f.line_number = l.line_number AND f.rule_name =
      '<rule>') THEN 1 ELSE 0 END per population row — the
      correction_application_rate template's shape, which never meets
      the fan-out check. Never a LEFT JOIN indicator: <match>.id IS NOT
      NULL over a joined findings row is the composite line join the
      fan-out check challenges (a line may carry more than one finding
      by schema, so the join is not declared one-to-one), and never a
      COUNT(<match>.id) grouped per row: a count is not an indicator
      (a row with two matches counts 2 and the "rate" runs past 1.0).
    tables: [invoice_lines, findings]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-08-31 pin pass (S2); indicator
        shape added after the 2026-09-02 re-run (Phase 5 Block 2); the
        joined-COUNT alternative replaced by the one-scope SUM(CASE)
        after the post-Block-2 bank (S2 3/5 -> 2/5); the LEFT JOIN
        indicator replaced by EXISTS after the post-coverage bank (S2
        0/5: the recommended shape itself drew the fan-out challenge
        on two reps). EXISTS returns 63/66 = 0.9545 in this world.
  - name: compliance_dual_signal
    summary: >-
      Critical compliance uses two deliberately different signals —
      the weight boost reads finding amounts, sweep protection reads
      the denormalized column.
    detail: >-
      The roll-up's flat weight boost fires when the SUM of
      COMPLIANCE finding amounts reaches the critical threshold
      (1500); stale-sweep protection instead reads
      invoices.compliance_score (denormalized from the compliance
      report). Excepting a compliance finding removes the boost but
      not the protection — the two questions have different answers
      by design.
    tables: [invoices, findings, compliance_reports]
  - name: no_closed_at_column
    summary: >-
      invoices has no closed/worked timestamp — completion times live
      in invoice_history.
    detail: >-
      To answer when an invoice was claimed or closed, join
      invoice_history and filter to_status ('CLAIMED', 'CLOSED',
      'NO_REVIEW_NEEDED') using invoice_history.at. received_at and
      scored_at are the only timestamps on invoices.
    tables: [invoices, invoice_history]
  - name: status_is_current
    summary: >-
      invoices.status is the current state only — past states and
      reactivations live in invoice_history.
    detail: >-
      An invoice that was LAPSED and later reactivated is no longer
      LAPSED: its status now reads CLAIMED, IN_REVIEW, or CLOSED.
      Filtering invoices.status = 'LAPSED' therefore excludes exactly
      the reactivated population. "Has an invoice ever been X" or
      "was reactivated / moved out of X" is a transition question:
      SELECT invoice_history.actor, invoices.invoice_number FROM
      invoice_history JOIN invoices ON invoices.id =
      invoice_history.invoice_id WHERE invoice_history.from_status =
      'LAPSED' — no filter on the current status. The sanctioned
      reactivation is performed by an audit manager (users.role =
      'audit_manager'); actor holds the user's short_name.
    tables: [invoices, invoice_history]
  - name: time_in_status
    summary: >-
      Time in a status pairs the transition that ENTERS it (to_status
      = X) with the one that LEAVES it (from_status = X) — two
      different invoice_history rows.
    detail: >-
      invoice_history rows are transitions, not states. "How long
      from RECEIVED to READY" is the gap between the row entering
      RECEIVED (to_status = 'RECEIVED') and the row leaving it
      (from_status = 'RECEIVED' AND to_status = 'READY'), joined per
      invoice_id. Reading both timestamps from the single READY
      transition row (CASE branches over from_status/to_status inside
      a WHERE to_status = 'READY' scope) subtracts a timestamp from
      itself and yields exactly 0:00:00 — the play session's W3. Units:
      leaving.at - entering.at is an INTERVAL, not a number. Scale it
      only after EPOCH — AVG(EPOCH(lv.at - en.at)) / 3600.0 AS
      avg_hours — or count units with DATE_DIFF('hour', en.at, lv.at).
      AVG(lv.at - en.at) / 86400 AS avg_time_in_days (the post-coverage
      W3) divides an interval by a number and yields an interval of
      0.041667 seconds, not 0.0417 days.
    tables: [invoice_history]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-08-31 play session (W3); the units
        paragraph added after the 2026-09-02 post-coverage bank (W3 rep
        4: interval / 86400 humanized "0 seconds", verified).
  - name: rule_name_prefixes
    summary: >-
      findings.rule_name drops the code's rule_ prefix, and
      compliance findings are named compliance_<rule code> — a naming
      convention, never a join key.
    detail: >-
      The rules engine's rule_rate_variance writes rule_name
      'rate_variance', and so on. Compliance-intake findings arrive
      as compliance_CR-147 etc. — filtering rule_name LIKE
      'compliance_%' selects exactly the compliance layer. But
      rule_name = 'compliance_' || rule_code is a DERIVED, NON-UNIQUE
      key (10 rule codes across 4,216 compliance_rules rows): used as
      a join condition it pairs every finding of a code with every
      rule of that code and fans out 17× and worse. Never join on it.
      For severity questions count compliance_rules directly — the
      invoices_to_compliance join path is the keyed road when invoice
      context is needed.
    tables: [findings, compliance_rules]

  - name: rate_means_dollars_here
    summary: >-
      In review and contract context "rate" is a dollar unit rate
      (requested_rate, contract_rate, unit_rate), not a percentage.
    detail: >-
      "What rate do auditors ask for", "the rate we requested", "the
      corrected rate" are dollars-per-unit questions answered from
      review_report_lines.requested_rate (see
      requested_rate_is_contract_rate) — never a share of findings.
      Percentage questions say "share", "how often", "what fraction",
      "what percent", and divide a count by its population; flag_rate,
      item_flag_rate and correction_application_rate are that kind.
      findings.category = 'CORRECTION' is the correction_ignored
      findings, and its share of all findings answers no rate question
      of either kind.
    tables: [review_report_lines, contracts, invoice_lines, findings]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.
  - name: corrections_never_resubmitted
    summary: >-
      A review that never drew a resubmission is neither applied nor
      ignored — leave it out of application rates and never count it as
      a rejection.
    detail: >-
      109 reviews; 61 drew a resubmission (invoices.supplier_acceptance
      set on the reviewed invoice), 48 did not (supplier_acceptance
      NULL). Applied and ignored are judged only where a successor
      exists: 73 correction lines with a successor = 55 applied + 18
      ignored, and the 18 are exactly the correction_ignored findings.
      Counting the 48 unanswered reviews as ignored, or reading
      review_reports.disposition (the auditor's verdict) as the
      supplier's response, overstates or inverts the answer. The
      per-line figure counts RATE and REMOVAL corrections alike; the
      rate-only subset (48 lines, 34 applied) is not the headline.
    tables: [review_reports, review_report_lines, invoices, findings]
    provenance:
      source: human
      confidence: 0.9
      needs_validation: false
      note: >-
        Hand-authored from the 2026-09-02 play session (W-A/W-B/W-C/R-A/
        F1: the review subsystem had no map coverage), against
        simulation/revisions.py and spine/prior_audit_compliance.py at
        761a18e9.

# Display hints (§10.5): the money columns as the pack author knows
# them. Consumer: run_sql tags result columns (and aliases ending in
# these names — total_opportunity) so every surface renders currency.
column_formats:
  - format: money
    columns:
      - invoices.invoice_total
      - invoices.opportunity
      - invoice_lines.extended_price
      - invoice_lines.unit_rate
      - contracts.contract_rate
      - contracts.list_price
      - review_report_lines.requested_rate
      - findings.amount
      - compliance_rules.amount

# Entity kinds (Backlog Pass): the things a conversation refers back to
# — "that invoice", "this rule" — and the columns that identify or name
# one. Consumers: run_sql's key lint treats key_columns, with every
# dictionary primary and foreign key, as id-like, so a literal on one
# that no result, question, or grounding in the conversation carried
# draws a challenge; the harness records the entity a turn's evidence
# established from key ∪ name columns; the Verifier checks a follow-up's
# declared entity against it. Name columns are never id-like. Rule
# labels are name-only by ruling: a rule name is a label the model
# legitimately spells from the docs on a first turn (26 distinct values,
# above the enum scan cap, never rendered into the grounding), so a key
# challenge there would be a false positive on correct SQL.
entities:
  - kind: invoice
    synonyms: [invoice]
    key_columns: [invoices.id, invoices.invoice_number]
    name_columns: [invoices.invoice_number]
  - kind: supplier
    synonyms: [supplier, vendor]
    key_columns: [suppliers.id, suppliers.code]
    name_columns: [suppliers.name]
  - kind: auditor
    synonyms: [auditor, reviewer, user]
    key_columns: [users.id, users.short_name]
    name_columns: [users.short_name, invoice_history.actor]
  - kind: rule
    synonyms: [rule, audit rule, compliance rule]
    key_columns: []
    name_columns: [findings.rule_name, compliance_rules.rule_code]
  - kind: item
    synonyms: [item, item code, part]
    key_columns: [invoice_lines.item_code, contracts.item_code]
    name_columns: [invoice_lines.item_code]

examples:
  - question: How many invoices received last week had findings?
    guidance: >-
      Join invoices to findings on invoice_id — an inner join: a LEFT
      JOIN counts every received invoice, not the flagged ones;
      COUNT(DISTINCT invoices.id); window on invoices.received_at
      anchored to the data's end (see data_coverage — "last week"
      means the final seven days ending 2026-05-30, i.e. received_at
      >= '2026-05-23 00:00:00' AND received_at < '2026-05-30
      00:00:00').
  - question: Which supplier draws the most rate-variance findings?
    guidance: >-
      findings WHERE rule_name = 'rate_variance', joined through
      invoices to suppliers; GROUP BY suppliers.code ORDER BY
      COUNT(*) DESC. Rate variance is the planted specialty of one
      supplier, so expect a dominant leader.
  - question: Is a given service item usually flagged for excessive hours?
    guidance: >-
      Use item_flag_rate with rule_name = 'service_hours_excessive'
      over invoice_lines filtered to the item_code — remember the
      composite line-level join (lines_to_findings).
  - question: Who closes the most reviews?
    guidance: >-
      auditor_throughput over invoice_history: to_status IN
      ('CLOSED', 'NO_REVIEW_NEEDED') GROUP BY actor, joined to users
      on short_name and filtered to role = 'auditor'.
  - question: How much recovery opportunity did each team close last month?
    guidance: >-
      recovered_opportunity per team/day (PRODUCTION_ROLLUP_SQL
      shape), windowed on invoice_history.at — anchored to the data's
      end, per data_coverage.
  - question: When auditors request corrections, what rate do they ask for?
    guidance: >-
      Dollars, not a percentage (rate_means_dollars_here):
      requested_rate_is_contract_rate — the answer is "the contract
      rate", shown as rate corrections at the contract rate beside the
      total, with the lowest and highest requested rates. Never the
      share of findings in category CORRECTION.
  - question: How often do suppliers actually apply the corrections we request?
    guidance: >-
      correction_application_rate (per correction, the default; name the
      reading). review_reports.disposition is the auditor's verdict on
      the invoice and says nothing about the supplier — APPROVED / all
      reviews is the wrong answer by two orders of magnitude.
  - question: Which supplier ignores our corrections the most, and how many?
    guidance: >-
      corrections_ignored_by_supplier — the correction_ignored findings,
      never a count of reviews or invoices without ACCEPTED (that counts
      reviews the supplier never answered).
  - question: List audit rejections by reviewer.
    guidance: >-
      corrections_ignored_by_auditor (ignored corrections per requesting
      auditor, the default; name the reading). REJECTED is not an
      invoice status: to_status never holds it, and
      review_reports.disposition holds only APPROVED /
      CORRECTIONS_REQUESTED. The reviewer is the actor who CLOSED the
      prior revision.
  - question: Show total invoiced amount per supplier, including suppliers with no invoice lines.
    guidance: >-
      LEFT JOIN from suppliers and SUM(invoices.invoice_total) with no
      COALESCE: suppliers with no invoices, and out-of-network suppliers
      whose invoices are born LAPSED with NULL totals and no lines, come
      back NULL — rendered as a dash, which is the truth ("nothing to
      sum"), where $0.00 asserts they invoiced nothing.
