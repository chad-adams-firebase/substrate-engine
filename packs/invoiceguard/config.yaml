# InvoiceGuard reference pack — a private engineering fixture, not a
# public demo (Brief §14). The application lives in its own repo;
# this directory holds only config, generated substrates, the primer,
# and pointers to the pinned clone.
name: invoiceguard
description: Supplier-invoice audit reference application (external repo, pinned clone).

substrates:
  - data_dictionary
  - data_dictionary_map
  - univariate_statistics
  - code_knowledge_graph
  - ckg_components
  - primer
  - source_code
  - application_database
  - application_logs
  - business_context_docs

tools:
  - query_univariate_stats
  - lookup_data_dictionary
  - traverse_code_knowledge_graph
  - run_sql
  - read_source
  - app_primer
  - search_business_docs
  - check_execution
  - answer_from_known_items
  - app_capabilities

adapters:
  llm:
    adapter: openrouter
    settings:
      # Dated snapshot, not the floating alias: the 2026-08-30
      # post-Block-1 run showed materially different router behavior
      # under openai/gpt-4o same-day. Reproducibility needs a pinned
      # model the way it needs a pinned seed. Verify this exact
      # string against OpenRouter's model list BEFORE the bank
      # re-run — a bad string must be caught then, never by turn one
      # of a live run.
      model: openai/gpt-4o-2024-11-20
  sql:
    adapter: duckdb
    settings:
      database: app.duckdb            # produced by `engine convert`
  work_store:
    adapter: sqlite
    settings:
      database: work.db
  identity:
    adapter: fake_user
    settings:
      username: dev
      display_name: Dev User
  source_code:
    adapter: local_directory
    settings:
      root: ../../../invoice-guard    # sibling clone of chad-adams-firebase/invoice-guard
      commit_sha: "761a18e9b9253870d930f1b13b3a852ce516d603"
  substrate_store:
    adapter: pack_files
    settings: {}
  execution_log:
    adapter: logfmt_file
    settings:
      path: ../../../invoice-guard/simout/logs/invoiceguard.log
      max_evidence_lines: 50
      # Component→logger/event templates: the SPL-template analog
      # (Brief §3). Queries are configuration; the LLM never writes
      # one. key_field names the log field a keyed did_run matches.
      components:
        stale_sweep:
          logger: invoiceguard.lapse_lifecycle
          ran_event: stale_sweep_completed
        nightly_recalc:
          logger: invoiceguard.rollup
          ran_event: nightly_recalc_completed
        creepback_scan:
          logger: invoiceguard.creepback
          ran_event: creepback_scan_completed
        benchmark_scoring:
          logger: invoiceguard.benchmark_scoring
          ran_event: benchmark_scored
          key_field: invoice_id
          # The benchmark client logs benchmark_fallback at WARNING
          # when the peer service is unreachable — the planted outage.
          error_levels: [WARNING, ERROR]
        rules_engine:
          logger: invoiceguard.rules_engine
          ran_event: rules_completed
          key_field: invoice_id
        intake:
          logger: invoiceguard.intake
          ran_event: file_processed
          key_field: file
        scheduler:
          logger: invoiceguard.scheduler
          ran_event: scheduled_task_executed

tool_settings:
  run_sql:
    max_repair_attempts: 2
    max_result_rows: 200
  search_business_docs:
    top_k: 5
  check_execution:
    max_errors: 50
    # The stats columns anchoring the log's data coverage — the
    # structured analog of the dictionary map's data_coverage gotcha.
    # Values resolve from the stats substrate at build; never dates
    # typed here, never wall-clock.
    coverage_columns:
      - invoices.received_at
      - scheduled_tasks.completed_at
    coverage_grace_days: 7

harness:
  # 8, not 6: the acceptance L3 run was refused with evidence in hand
  # after nudges ate the budget. Two extra steps cost seconds and
  # cents on pathological turns only; refusing correct work costs the
  # answer.
  max_router_iterations: 8
  max_draft_retries: 2
  max_rows_in_context: 30
  # A placeholder injects a value; anything longer than this on one
  # line, or anything multi-line, is a passage and belongs in a fenced
  # code block or in the drafter's own words (Block 2's text-block
  # guard). 120 clears qualified names and file paths, and catches
  # component descriptions and the 240-char doc snippets.
  inline_value_max_chars: 120
  # to_status carries all seven lifecycle values (invoices.status
  # never shows RECEIVED/CLAIMED/IN_REVIEW — NP6's 4-vs-7 tension);
  # rendered into the router's definitional bullet so lifecycle
  # questions reach app_primer first (play pass R1/R3/R5).
  lifecycle_status_columns:
    - invoice_history.to_status

verifier:
  max_regenerate_retries: 1
  unmatched_final: unverified
  judge:
    enabled: true
    max_calls_per_turn: 5
    max_candidate_values: 10
  plausibility:
    # Tuned at work against real distributions (Brief §9.3); these fit
    # the seed-42 world, whose data ends 2026-05-30 — date bounds come
    # from the stats substrate, never the wall clock.
    row_count_tolerance_pct: 10.0
    enforce_filtered_count_bound: true
    enforce_min_max_bounds: true
    enforce_date_bounds: true
    date_bound_grace_days: 7
    # A 0 or empty run_sql result ships unverified, never verified —
    # S4's 0-for-114 and S7's empty-for-mona were both verified.
    challenge_zero_results: true
    # Aggregate-vs-stats (play pass): SUM columns capped at
    # mean × non-null count, AVG columns held to [min, max]. The
    # bounds are impossible-if-clean, so the tolerance covers only
    # float slop and stats staleness — within it warns (ships
    # [UNVERIFIED]), beyond it refuses. W1's ×4–5 fanned sums land
    # far past any tolerance.
    enforce_aggregate_bounds: true
    aggregate_bound_tolerance_pct: 10.0
    aggregate_cell_sample_rows: 50
    # Joined-count bound (pin pass, MT2's backstop): a count over
    # joined tables cannot honestly exceed the largest queried table —
    # a filter only lowers a count, only a fanning join raises it.
    # 1.0× warns (ships [UNVERIFIED]); 3.0× refuses, leaving room for
    # a modest deliberate many-to-many. MT2's expression-join fan was
    # 17.8× (107,509 over findings' 6,042). Honest line-grain joins
    # land at exactly 1.0× of invoice_lines and pass.
    enforce_joined_count_bound: true
    joined_count_warn_factor: 1.0
    joined_count_fail_factor: 3.0
    # Entity-count bound (guard pass, AMB2's backstop): a count aliased
    # with an entity noun — invoice_count, total_invoices — cannot
    # exceed that entity's table. The post-duration AMB2 shipped
    # `COUNT(*) AS invoice_count FROM invoice_history` = 6,432 verified
    # against 1,990 invoices; a filtered single-table count under
    # invoice_history's 8,345 passes every other bound. Warn only (an
    # alias is a convention, not a type), so the answer ships
    # [UNVERIFIED]. Replayed over the post-duration report before it
    # landed: 53 count aliases resolved, 3 hits, all three AMB2.
    enforce_entity_count_bound: true
    # Saturated rates (pin pass, S2's backstop): exactly 0.0 or 1.0 on
    # a rate-named column is legal but is also exactly what AVG over a
    # NULL-padded indicator produces — warn only, so a legitimate
    # extreme ships [UNVERIFIED] rather than refused. A count cell
    # under 20 in the same row suppresses it: tiny populations
    # saturate honestly (SVC-4410's 66 lines do not).
    challenge_saturated_rates: true
    saturated_rate_min_basis: 20
    # Degenerate durations (duration pass, W3 rep 4's backstop): an
    # aggregate duration below one second is legal (an instant
    # transition) but is also exactly what interval arithmetic scaled
    # by a unit produces — AVG(a - b) / 86400 is an interval of
    # 0.041667 seconds, humanized "0 seconds", and it verified. Warn
    # only, so a legitimate zero ships [UNVERIFIED] rather than refused;
    # a count cell under 20 in the same row suppresses it.
    challenge_degenerate_durations: true
    degenerate_duration_min_basis: 20
    # Duration span bound (duration pass, the class's ceiling): a
    # duration longer than the queried tables' timestamp span
    # (invoice_history.at runs 88 days in this world) cannot be an
    # average, a minimum, a maximum or one row's elapsed time — refuses.
    # A SUM over a population is exempt; an EPOCH-shaped item the parse
    # cannot classify warns instead.
    enforce_duration_span_bound: true

ui:
  app_name: InvoiceGuard Knowledge
  accent_color: "#2f6f5e"
  starter_prompts:
    - How many invoices received last week had findings?
    - Which supplier gets flagged most often for rate variance?
    - What's in the READY backlog right now — count and total opportunity?
    - Show me the source of rule_rate_variance
    - What does this application do?
  # app_capabilities' whole evidence: the answer to "what can I ask
  # you?" as the pack wants it told. De-identified, like everything
  # in this repo.
  capabilities: >-
    This assistant answers questions about the InvoiceGuard
    application from verified evidence only. Ask about the data
    (counts, rates, listings — "how many invoices had findings last
    week"), the code (what a rule does, what a function calls, the
    source itself), the workflow (invoice statuses and lifecycle, what
    the components do), execution ("did the nightly recalc run, were
    there errors"), or policy ("why does this rule exist"). Every
    answer is checked against its evidence before it ships; when the
    evidence can't support an answer, it says so instead of guessing.
    It reads the application's data and code; it cannot change
    anything, and it doesn't answer questions unrelated to the
    application.

display:
  money:
    symbol: "$"
    # Aliases the map's column list cannot reach: metric-shaped names
    # that carry dollars without ending in a money column's name.
    # *_savings_* is Play Session #2's avg_savings_per_invoice — a CTE
    # ratio the select-list parse cannot classify (SUM(CASE) over a
    # count), rendered 4698.219326550668 where the truth is $4,698.22.
    column_patterns: ["*_savings", "*_savings_*", "*_dollars", "recovered_*"]
  # Elapsed-time aliases and the unit their numbers count (Phase 5
  # Block 2: the play session read 1.0806402437502474 days and
  # 1:00:00 where a manager reads "1.1 days" and "1 hour"). The SQL
  # author's unit is in the alias — julianday differences are days,
  # strftime('%s') differences are seconds — so the globs are the
  # only place the engine can learn it. clock lists aliases whose
  # cells are H:MM:SS strings (SQLite time()); those carry their own
  # unit. service_hours is a billed quantity, but "8 hours" is still
  # how a manager reads it.
  duration:
    days: ["*_days", "days_*", "*_days_*"]
    hours: ["*_hours", "hours_*", "*_hours_*"]
    minutes: ["*_minutes", "minutes_*", "*_minutes_*"]
    seconds: ["*_seconds", "seconds_*", "*_seconds_*"]
    clock: ["*duration*", "*time_in_*", "*time_between*", "*elapsed*", "avg_time*", "*_time_to_*"]
  # Rate aliases and their scale (Phase 5 interlude coverage pass: the
  # play session read 0.9221105527638191 where a manager reads 92.2%).
  # fraction cells are 0–1 and show x100; percent cells were already
  # multiplied by 100 by the SQL author — the alias is the only place
  # that decision is visible, so the alias decides. *_ratio is in
  # neither list on purpose: a ratio may exceed 1 and is not a percent.
  # The Verifier's rate bounds read the same hint (0–1 or 0–100), and a
  # percent column whose cells all sit at or below 1.0 draws a
  # scale-suspect warn — a fraction written into a _pct alias.
  rate:
    fraction: ["*_rate", "*_share", "share_*", "*_fraction"]
    percent: ["*_pct", "pct_*", "*_percent", "*_percentage", "percent_*"]

generation:
  source_sqlite: ../../../invoice-guard/simout/invoiceguard.db
  simulation_seed: 42
  component_id_prefix: ig
  source_globs:
    - src/invoiceguard/**/*.py
  exclude_globs:
    # The simulation driver is world-building tooling, not the app the
    # analyst asks about; the real target repo has no analog of it.
    - src/invoiceguard/simulation/**
  enum_scan_max_distinct: 12
